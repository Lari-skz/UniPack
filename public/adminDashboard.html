<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - UniPack</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'cyber-dark': '#0A0E27',
                        'cyber-darker': '#151935',
                        'cyber-cyan': '#00F0FF',
                        'cyber-pink': '#FF006E',
                        'cyber-green': '#39FF14',
                        'cyber-text': '#F0F0F0',
                        'cyber-muted': '#9CA3AF',
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-cyber-dark min-h-screen">

<!-- Header -->
<header class="bg-cyber-darker/80 backdrop-blur-lg shadow-lg sticky top-0 z-50 border-b border-cyber-pink/30">
    <div class="container mx-auto px-4 py-4 flex justify-between items-center">
        <div class="flex items-center gap-3">
            <i class="fas fa-shield-alt text-cyber-pink text-2xl"></i>
            <div class="text-2xl font-bold bg-gradient-to-r from-cyber-pink to-cyber-cyan bg-clip-text text-transparent">
                Admin Dashboard
            </div>
        </div>
        <div class="flex items-center gap-4">
            <span class="text-cyber-text">
                <i class="fas fa-user-shield text-cyber-pink mr-2"></i>
                <span id="adminName" class="text-cyber-cyan font-semibold"></span>
            </span>
            <button id="logoutBtn" class="bg-cyber-pink hover:bg-red-600 text-white px-4 py-2 rounded-lg transition-colors">
                <i class="fas fa-sign-out-alt mr-2"></i>Logout
            </button>
        </div>
    </div>
</header>

<!-- Main Content -->
<main class="container mx-auto px-4 py-8">

    <!-- Loading Indicator -->
    <div id="loadingIndicator" class="hidden fixed inset-0 bg-black/50 flex items-center justify-center z-50">
        <div class="bg-cyber-darker border border-cyber-cyan/30 rounded-2xl p-8">
            <div class="flex items-center gap-4">
                <i class="fas fa-spinner fa-spin text-cyber-cyan text-3xl"></i>
                <span class="text-cyber-text text-xl">Loading...</span>
            </div>
        </div>
    </div>

    <!-- Success/Error Messages -->
    <div id="successMessage" class="hidden bg-green-500/20 border border-green-500 text-green-400 px-4 py-3 rounded-lg mb-4">
        <i class="fas fa-check-circle mr-2"></i>
        <span id="successText"></span>
    </div>

    <div id="errorMessage" class="hidden bg-red-500/20 border border-red-500 text-red-400 px-4 py-3 rounded-lg mb-4">
        <i class="fas fa-exclamation-circle mr-2"></i>
        <span id="errorText"></span>
    </div>

    <!-- Stats Grid -->
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6 mb-8">
        <!-- Total Users -->
        <div class="bg-gradient-to-br from-cyber-darker to-cyber-dark border border-cyber-cyan/30 rounded-lg p-6 hover:shadow-cyber-cyan transition-all">
            <div class="flex items-center justify-between mb-4">
                <div class="w-12 h-12 bg-cyber-cyan/20 rounded-lg flex items-center justify-center">
                    <i class="fas fa-users text-cyber-cyan text-xl"></i>
                </div>
                <span class="text-cyber-muted text-sm">Total</span>
            </div>
            <div class="text-4xl font-bold text-cyber-cyan mb-2" id="totalUsers">0</div>
            <div class="text-cyber-muted text-sm">Registered Users</div>
        </div>

        <!-- Active Users -->
        <div class="bg-gradient-to-br from-cyber-darker to-cyber-dark border border-cyber-green/30 rounded-lg p-6 hover:shadow-lg transition-all">
            <div class="flex items-center justify-between mb-4">
                <div class="w-12 h-12 bg-cyber-green/20 rounded-lg flex items-center justify-center">
                    <i class="fas fa-user-check text-cyber-green text-xl"></i>
                </div>
                <span class="text-cyber-muted text-sm">Active</span>
            </div>
            <div class="text-4xl font-bold text-cyber-green mb-2" id="activeUsers">0</div>
            <div class="text-cyber-muted text-sm">Last 30 Days</div>
        </div>

        <!-- Total Tasks -->
        <div class="bg-gradient-to-br from-cyber-darker to-cyber-dark border border-blue-500/30 rounded-lg p-6 hover:shadow-lg transition-all">
            <div class="flex items-center justify-between mb-4">
                <div class="w-12 h-12 bg-blue-500/20 rounded-lg flex items-center justify-center">
                    <i class="fas fa-tasks text-blue-400 text-xl"></i>
                </div>
                <span class="text-cyber-muted text-sm">Total</span>
            </div>
            <div class="text-4xl font-bold text-blue-400 mb-2" id="totalTasks">0</div>
            <div class="text-cyber-muted text-sm">All Tasks</div>
        </div>

        <!-- Total Events -->
        <div class="bg-gradient-to-br from-cyber-darker to-cyber-dark border border-cyber-pink/30 rounded-lg p-6 hover:shadow-cyber-pink transition-all">
            <div class="flex items-center justify-between mb-4">
                <div class="w-12 h-12 bg-cyber-pink/20 rounded-lg flex items-center justify-center">
                    <i class="fas fa-calendar-alt text-cyber-pink text-xl"></i>
                </div>
                <span class="text-cyber-muted text-sm">Total</span>
            </div>
            <div class="text-4xl font-bold text-cyber-pink mb-2" id="totalEvents">0</div>
            <div class="text-cyber-muted text-sm">All Events</div>
        </div>
    </div>

    <!-- Secondary Stats -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
        <!-- Total Categories -->
        <div class="bg-cyber-darker border border-purple-500/30 rounded-lg p-6">
            <div class="flex items-center gap-4">
                <div class="w-12 h-12 bg-purple-500/20 rounded-lg flex items-center justify-center">
                    <i class="fas fa-tags text-purple-400 text-xl"></i>
                </div>
                <div>
                    <div class="text-3xl font-bold text-purple-400" id="totalCategories">0</div>
                    <div class="text-cyber-muted text-sm">Categories</div>
                </div>
            </div>
        </div>

        <!-- Completed Tasks -->
        <div class="bg-cyber-darker border border-green-500/30 rounded-lg p-6">
            <div class="flex items-center gap-4">
                <div class="w-12 h-12 bg-green-500/20 rounded-lg flex items-center justify-center">
                    <i class="fas fa-check-circle text-green-400 text-xl"></i>
                </div>
                <div>
                    <div class="text-3xl font-bold text-green-400" id="completedTasks">0</div>
                    <div class="text-cyber-muted text-sm">Completed</div>
                </div>
            </div>
        </div>

        <!-- Pending Tasks -->
        <div class="bg-cyber-darker border border-yellow-500/30 rounded-lg p-6">
            <div class="flex items-center gap-4">
                <div class="w-12 h-12 bg-yellow-500/20 rounded-lg flex items-center justify-center">
                    <i class="fas fa-clock text-yellow-400 text-xl"></i>
                </div>
                <div>
                    <div class="text-3xl font-bold text-yellow-400" id="pendingTasks">0</div>
                    <div class="text-cyber-muted text-sm">Pending</div>
                </div>
            </div>
        </div>
    </div>

    <!-- Users Management Section -->
    <section class="mb-8">
        <div class="flex items-center justify-between mb-6">
            <h2 class="text-3xl font-bold text-cyber-text">
                <i class="fas fa-users-cog mr-3 text-cyber-pink"></i>User Management
            </h2>
        </div>

        <!-- Users Table -->
        <div class="bg-cyber-darker border border-cyber-cyan/30 rounded-lg overflow-hidden">
            <div class="overflow-x-auto">
                <table class="w-full">
                    <thead class="bg-cyber-dark border-b border-cyber-cyan/30">
                        <tr>
                            <th class="px-6 py-4 text-left text-cyber-cyan font-semibold">User</th>
                            <th class="px-6 py-4 text-center text-cyber-cyan font-semibold">Role</th>
                            <th class="px-6 py-4 text-center text-cyber-cyan font-semibold">Tasks</th>
                            <th class="px-6 py-4 text-center text-cyber-cyan font-semibold">Events</th>
                            <th class="px-6 py-4 text-center text-cyber-cyan font-semibold">Categories</th>
                            <th class="px-6 py-4 text-center text-cyber-cyan font-semibold">Joined</th>
                            <th class="px-6 py-4 text-center text-cyber-cyan font-semibold">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="usersContainer">
                        <!-- Users will be rendered here by JavaScript -->
                    </tbody>
                </table>
            </div>
        </div>
    </section>

</main>

<!-- Footer -->
<footer class="bg-cyber-dark border-t border-cyber-cyan/30 text-cyber-text py-8 mt-12">
    <div class="container mx-auto px-4 text-center">
        <p class="text-cyber-muted text-sm">
            <i class="fas fa-shield-alt text-cyber-pink mr-2"></i>
            Admin Panel &copy; 2026 UniPack by LunosCode
        </p>
    </div>
</footer>

<!-- Scripts -->
<script src="/js/api.js"></script>
<script src="/js/admin.js"></script>

</body>
</html>
