<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - UniPack</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'cyber-dark': '#0A0E27',
                        'cyber-darker': '#151935',
                        'cyber-cyan': '#00F0FF',
                        'cyber-pink': '#FF006E',
                        'cyber-green': '#39FF14',
                        'cyber-text': '#F0F0F0',
                        'cyber-muted': '#9CA3AF',
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-cyber-dark min-h-screen">

<!-- Header -->
<header class="bg-cyber-darker/80 backdrop-blur-lg shadow-lg sticky top-0 z-50 border-b border-cyber-cyan/30">
    <div class="container mx-auto px-4 py-4 flex justify-between items-center">
        <div class="text-2xl font-bold bg-gradient-to-r from-cyber-cyan to-cyber-pink bg-clip-text text-transparent">
            UniPack
        </div>
        <div class="flex items-center gap-4">
            <span class="text-cyber-text">Welcome, <span id="userName" class="text-cyber-cyan font-semibold"></span>!</span>
            <button id="logoutBtn" class="bg-cyber-pink hover:bg-red-600 text-white px-4 py-2 rounded-lg transition-colors">
                <i class="fas fa-sign-out-alt mr-2"></i>Logout
            </button>
        </div>
    </div>
</header>

<!-- Main Content -->
<main class="container mx-auto px-4 py-8">

    <!-- Success/Error Messages -->
    <div id="successMessage" class="hidden bg-green-500/20 border border-green-500 text-green-400 px-4 py-3 rounded-lg mb-4">
        <i class="fas fa-check-circle mr-2"></i>
        <span id="successText"></span>
    </div>

    <div id="errorMessage" class="hidden bg-red-500/20 border border-red-500 text-red-400 px-4 py-3 rounded-lg mb-4">
        <i class="fas fa-exclamation-circle mr-2"></i>
        <span id="errorText"></span>
    </div>

    <!-- Stats Cards -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
        <div class="bg-cyber-darker border border-cyber-cyan/30 rounded-lg p-6">
            <div class="text-cyber-muted mb-2">Total Tasks</div>
            <div class="text-4xl font-bold text-cyber-cyan" id="totalTasks">0</div>
        </div>
        <div class="bg-cyber-darker border border-cyber-green/30 rounded-lg p-6">
            <div class="text-cyber-muted mb-2">Completed</div>
            <div class="text-4xl font-bold text-cyber-green" id="completedTasks">0</div>
        </div>
        <div class="bg-cyber-darker border border-cyber-pink/30 rounded-lg p-6">
            <div class="text-cyber-muted mb-2">Pending</div>
            <div class="text-4xl font-bold text-cyber-pink" id="pendingTasks">0</div>
        </div>
    </div>

    <!-- Categories Section -->
    <section class="mb-8">
        <div class="flex items-center justify-between mb-4">
            <h2 class="text-2xl font-bold text-cyber-text">
                <i class="fas fa-tags mr-2"></i>Categories
            </h2>
            <button id="openCategoryModal" class="bg-gradient-to-r from-cyber-cyan to-blue-500 text-cyber-dark px-4 py-2 rounded-lg hover:shadow-lg transition-all">
                <i class="fas fa-plus mr-2"></i>New Category
            </button>
        </div>
        <div id="categoriesContainer" class="grid grid-cols-1 md:grid-cols-3 gap-4">
            <!-- Categories will be rendered here -->
        </div>
    </section>

    <!-- Tasks Section -->
    <section class="mb-8">
        <div class="flex items-center justify-between mb-4">
            <h2 class="text-2xl font-bold text-cyber-text">
                <i class="fas fa-tasks mr-2"></i>Tasks
            </h2>
            <button id="openTaskModal" class="bg-gradient-to-r from-cyber-cyan to-blue-500 text-cyber-dark px-4 py-2 rounded-lg hover:shadow-lg transition-all">
                <i class="fas fa-plus mr-2"></i>New Task
            </button>
        </div>
        <div id="tasksContainer" class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <!-- Tasks will be rendered here -->
        </div>
    </section>

    <!-- Events Section -->
    <section class="mb-8">
        <div class="flex items-center justify-between mb-4">
            <h2 class="text-2xl font-bold text-cyber-text">
                <i class="fas fa-calendar-alt mr-2"></i>Events
            </h2>
            <button id="openEventModal" class="bg-gradient-to-r from-cyber-pink to-purple-500 text-white px-4 py-2 rounded-lg hover:shadow-lg transition-all">
                <i class="fas fa-plus mr-2"></i>New Event
            </button>
        </div>
        <div id="eventsContainer" class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <!-- Events will be rendered here -->
        </div>
    </section>

</main>

<!-- Category Modal -->
<div id="categoryModal" class="hidden fixed inset-0 bg-black/50 flex items-center justify-center z-50">
    <div class="bg-cyber-darker border border-cyber-cyan/30 rounded-2xl p-8 max-w-md w-full mx-4">
        <div class="flex items-center justify-between mb-6">
            <h3 class="text-2xl font-bold text-cyber-text">New Category</h3>
            <button id="closeCategoryModal" class="text-cyber-muted hover:text-cyber-text">
                <i class="fas fa-times text-xl"></i>
            </button>
        </div>
        <form id="categoryForm" class="space-y-4">
            <div>
                <label class="block text-cyber-text mb-2">Name *</label>
                <input type="text" id="categoryName" required
                       placeholder="e.g., Study, Work, Personal"
                       class="w-full px-4 py-3 bg-cyber-dark border border-cyber-cyan/30 rounded-lg text-cyber-text placeholder-cyber-muted focus:outline-none focus:border-cyber-cyan">
            </div>
            <div>
                <label class="block text-cyber-text mb-2">Description</label>
                <textarea id="categoryDescription"
                          placeholder="Optional description"
                          class="w-full px-4 py-3 bg-cyber-dark border border-cyber-cyan/30 rounded-lg text-cyber-text placeholder-cyber-muted focus:outline-none focus:border-cyber-cyan"
                          rows="3"></textarea>
            </div>
            <div>
                <label class="block text-cyber-text mb-2">Color</label>
                <input type="color" id="categoryColor" value="#00F0FF"
                       class="w-full h-12 px-2 bg-cyber-dark border border-cyber-cyan/30 rounded-lg cursor-pointer">
            </div>
            <button type="submit" class="w-full bg-gradient-to-r from-cyber-cyan to-blue-500 text-cyber-dark font-bold py-3 rounded-lg hover:shadow-lg transition-all">
                <i class="fas fa-plus mr-2"></i>Create Category
            </button>
        </form>
    </div>
</div>

<!-- Task Modal -->
<div id="taskModal" class="hidden fixed inset-0 bg-black/50 flex items-center justify-center z-50">
    <div class="bg-cyber-darker border border-cyber-cyan/30 rounded-2xl p-8 max-w-md w-full mx-4 max-h-[90vh] overflow-y-auto">
        <div class="flex items-center justify-between mb-6">
            <h3 class="text-2xl font-bold text-cyber-text">New Task</h3>
            <button id="closeTaskModal" class="text-cyber-muted hover:text-cyber-text">
                <i class="fas fa-times text-xl"></i>
            </button>
        </div>
        <form id="taskForm" class="space-y-4">
            <div>
                <label class="block text-cyber-text mb-2">Title *</label>
                <input type="text" id="taskTitle" required
                       placeholder="e.g., Complete project documentation"
                       class="w-full px-4 py-3 bg-cyber-dark border border-cyber-cyan/30 rounded-lg text-cyber-text placeholder-cyber-muted focus:outline-none focus:border-cyber-cyan">
            </div>
            <div>
                <label class="block text-cyber-text mb-2">Description</label>
                <textarea id="taskDescription"
                          placeholder="Task details (optional)"
                          class="w-full px-4 py-3 bg-cyber-dark border border-cyber-cyan/30 rounded-lg text-cyber-text placeholder-cyber-muted focus:outline-none focus:border-cyber-cyan"
                          rows="3"></textarea>
            </div>
            <div>
                <label class="block text-cyber-text mb-2">Category</label>
                <select id="taskCategory"
                        class="w-full px-4 py-3 bg-cyber-dark border border-cyber-cyan/30 rounded-lg text-cyber-text focus:outline-none focus:border-cyber-cyan">
                    <option value="">No Category</option>
                    <!-- Categories will be populated here -->
                </select>
            </div>
            <div>
                <label class="block text-cyber-text mb-2">Due Date *</label>
                <input type="date" id="taskDueDate" required
                       class="w-full px-4 py-3 bg-cyber-dark border border-cyber-cyan/30 rounded-lg text-cyber-text focus:outline-none focus:border-cyber-cyan">
            </div>
            <div>
                <label class="block text-cyber-text mb-2">Priority *</label>
                <select id="taskPriority" required
                        class="w-full px-4 py-3 bg-cyber-dark border border-cyber-cyan/30 rounded-lg text-cyber-text focus:outline-none focus:border-cyber-cyan">
                    <option value="low">🟢 Low</option>
                    <option value="medium" selected>🟡 Medium</option>
                    <option value="high">🔴 High</option>
                </select>
            </div>
            <button type="submit" class="w-full bg-gradient-to-r from-cyber-cyan to-blue-500 text-cyber-dark font-bold py-3 rounded-lg hover:shadow-lg transition-all">
                <i class="fas fa-plus mr-2"></i>Create Task
            </button>
        </form>
    </div>
</div>

<!-- Event Modal -->
<div id="eventModal" class="hidden fixed inset-0 bg-black/50 flex items-center justify-center z-50">
    <div class="bg-cyber-darker border border-cyber-pink/30 rounded-2xl p-8 max-w-md w-full mx-4">
        <div class="flex items-center justify-between mb-6">
            <h3 class="text-2xl font-bold text-cyber-text">New Event</h3>
            <button id="closeEventModal" class="text-cyber-muted hover:text-cyber-text">
                <i class="fas fa-times text-xl"></i>
            </button>
        </div>
        <form id="eventForm" class="space-y-4">
            <div>
                <label class="block text-cyber-text mb-2">Title *</label>
                <input type="text" id="eventTitle" required
                       placeholder="e.g., Team Meeting, Exam, Birthday"
                       class="w-full px-4 py-3 bg-cyber-dark border border-cyber-pink/30 rounded-lg text-cyber-text placeholder-cyber-muted focus:outline-none focus:border-cyber-pink">
            </div>
            <div>
                <label class="block text-cyber-text mb-2">Description</label>
                <textarea id="eventDescription"
                          placeholder="Event details (optional)"
                          class="w-full px-4 py-3 bg-cyber-dark border border-cyber-pink/30 rounded-lg text-cyber-text placeholder-cyber-muted focus:outline-none focus:border-cyber-pink"
                          rows="3"></textarea>
            </div>
            <div>
                <label class="block text-cyber-text mb-2">Date *</label>
                <input type="date" id="eventDate" required
                       class="w-full px-4 py-3 bg-cyber-dark border border-cyber-pink/30 rounded-lg text-cyber-text focus:outline-none focus:border-cyber-pink">
            </div>
            <div>
                <label class="block text-cyber-text mb-2">Time *</label>
                <input type="time" id="eventTime" required
                       class="w-full px-4 py-3 bg-cyber-dark border border-cyber-pink/30 rounded-lg text-cyber-text focus:outline-none focus:border-cyber-pink">
            </div>
            <div>
                <label class="block text-cyber-text mb-2">Color</label>
                <input type="color" id="eventColor" value="#FF006E"
                       class="w-full h-12 px-2 bg-cyber-dark border border-cyber-pink/30 rounded-lg cursor-pointer">
            </div>
            <button type="submit" class="w-full bg-gradient-to-r from-cyber-pink to-purple-500 text-white font-bold py-3 rounded-lg hover:shadow-lg transition-all">
                <i class="fas fa-plus mr-2"></i>Create Event
            </button>
        </form>
    </div>
</div>

<!-- Footer -->
<footer class="bg-cyber-dark border-t border-cyber-cyan/30 text-cyber-text py-8 mt-12">
    <div class="container mx-auto px-4 text-center">
        <p class="text-cyber-muted text-sm">&copy; 2026 UniPack by LunosCode. All rights reserved.</p>
    </div>
</footer>

<!-- Scripts -->
<script src="/js/api.js"></script>
<script src="/js/dashboard.js"></script>

</body>
</html>
