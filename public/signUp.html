<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign Up - UniPack</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'cyber-dark': '#0A0E27',
                        'cyber-darker': '#151935',
                        'cyber-cyan': '#00F0FF',
                        'cyber-pink': '#FF006E',
                        'cyber-green': '#39FF14',
                        'cyber-text': '#F0F0F0',
                        'cyber-muted': '#9CA3AF',
                    },
                    boxShadow: {
                        'cyber-cyan': '0 0 20px rgba(0, 240, 255, 0.4)',
                        'cyber-pink': '0 0 20px rgba(255, 0, 110, 0.4)',
                    }
                }
            }
        }
    </script>
</head>

<body class="bg-cyber-dark min-h-screen">

<header class="bg-cyber-darker/80 backdrop-blur-lg shadow-lg sticky top-0 z-50 border-b border-cyber-cyan/30">
    <div class="container mx-auto px-4 py-4 flex justify-between items-center">
        <a href="/" class="w-20 h-10 bg-gradient-to-r from-cyber-cyan to-cyber-pink rounded-full flex items-center justify-center text-cyber-dark font-bold shadow-cyber-cyan hover:shadow-cyber-pink transition-all">
            UniPack
        </a>
        <nav class="flex items-center gap-6">
            <a href="/" class="text-cyber-text hover:text-cyber-cyan transition-colors">
                <i class="fas fa-home mr-2"></i>Home
            </a>
            <a href="/login.html" class="text-cyber-muted hover:text-cyber-cyan transition-colors">
                <span class="text-cyber-cyan font-semibold">Login</span>
            </a>
        </nav>
    </div>
</header>

<main>
<section class="py-16 relative overflow-hidden">

    <!-- Animated background -->
    <div class="absolute inset-0 opacity-20">
        <div class="absolute top-1/4 left-1/4 w-96 h-96 bg-cyber-pink rounded-full blur-3xl animate-pulse"></div>
        <div class="absolute bottom-1/4 right-1/4 w-96 h-96 bg-cyber-cyan rounded-full blur-3xl animate-pulse"></div>
    </div>

    <div class="container mx-auto px-4 relative z-10">
        <div class="max-w-xl mx-auto">

            <!-- Header -->
            <div class="text-center mb-8">
                <h1 class="text-5xl font-bold mb-4 bg-gradient-to-r from-cyber-pink to-cyber-cyan bg-clip-text text-transparent">
                    Join UniPack
                </h1>
                <p class="text-cyber-muted text-lg">
                    Create your account and start organizing! 🚀
                </p>
            </div>

            <!-- Signup Card -->
            <div class="bg-cyber-darker/60 backdrop-blur-lg border border-cyber-pink/30 rounded-2xl p-8 shadow-cyber-pink">
                <form id="signUpForm" class="space-y-6">

                    <!-- Name -->
                    <div>
                        <label for="name" class="block text-cyber-text mb-2">Full Name *</label>
                        <input type="text" id="name" name="name" required placeholder="John Doe"
                               class="w-full px-4 py-3 bg-cyber-dark border border-cyber-pink/30 rounded-lg text-cyber-text placeholder-cyber-muted focus:outline-none focus:border-cyber-pink focus:shadow-cyber-pink transition-all">
                    </div>

                    <!-- Email -->
                    <div>
                        <label for="email" class="block text-cyber-text mb-2">Email *</label>
                        <input type="email" id="email" name="email" required placeholder="student@university.edu"
                               class="w-full px-4 py-3 bg-cyber-dark border border-cyber-pink/30 rounded-lg text-cyber-text placeholder-cyber-muted focus:outline-none focus:border-cyber-pink focus:shadow-cyber-pink transition-all">
                    </div>

                    <!-- Password -->
                    <div>
                        <label for="password" class="block text-cyber-text mb-2">Password *</label>
                        <div class="relative">
                            <input type="password" id="password" name="password" required placeholder="At least 8 characters"
                                   class="w-full px-4 py-3 bg-cyber-dark border border-cyber-pink/30 rounded-lg text-cyber-text placeholder-cyber-muted focus:outline-none focus:border-cyber-pink focus:shadow-cyber-pink transition-all">
                            <button type="button" onclick="togglePassword()" class="absolute right-3 top-1/2 -translate-y-1/2 text-cyber-muted hover:text-cyber-pink transition-colors">
                                <i class="fas fa-eye" id="toggleIcon"></i>
                            </button>
                        </div>
                    </div>

                    <!-- Password Confirmation -->
                    <div>
                        <label for="password_confirmation" class="block text-cyber-text mb-2">Confirm Password *</label>
                        <div class="relative">
                            <input type="password" id="password_confirmation" name="password_confirmation" required placeholder="Re-enter your password"
                                   class="w-full px-4 py-3 bg-cyber-dark border border-cyber-pink/30 rounded-lg text-cyber-text placeholder-cyber-muted focus:outline-none focus:border-cyber-pink focus:shadow-cyber-pink transition-all">
                            <button type="button" onclick="togglePasswordConfirmation()" class="absolute right-3 top-1/2 -translate-y-1/2 text-cyber-muted hover:text-cyber-pink transition-colors">
                                <i class="fas fa-eye" id="toggleConfirmIcon"></i>
                            </button>
                        </div>
                    </div>

                    <!-- Terms & Conditions -->
                    <div class="flex items-start gap-2">
                        <input type="checkbox" id="terms" required class="w-4 h-4 mt-1 rounded">
                        <label for="terms" class="text-cyber-muted text-sm">
                            I agree to the <a href="#" class="text-cyber-cyan hover:text-cyber-pink transition-colors">Terms & Conditions</a>
                            and <a href="#" class="text-cyber-cyan hover:text-cyber-pink transition-colors">Privacy Policy</a>
                        </label>
                    </div>

                    <!-- Error Message (hidden by default) -->
                    <div id="errorMessage" class="hidden bg-red-500/20 border border-red-500 text-red-400 px-4 py-3 rounded-lg">
                        <i class="fas fa-exclamation-circle mr-2"></i>
                        <span id="errorText"></span>
                    </div>

                    <!-- Success Message (hidden by default) -->
                    <div id="successMessage" class="hidden bg-green-500/20 border border-green-500 text-green-400 px-4 py-3 rounded-lg">
                        <i class="fas fa-check-circle mr-2"></i>
                        <span id="successText"></span>
                    </div>

                    <!-- Sign Up Button -->
                    <button type="submit" id="signUpButton"
                            class="w-full bg-gradient-to-r from-cyber-pink to-purple-500 text-white font-bold text-lg py-4 rounded-lg hover:shadow-cyber-pink transition-all duration-300 transform hover:-translate-y-1">
                        <i class="fas fa-user-plus mr-2"></i>Create Account
                    </button>

                    <!-- Divider -->
                    <div class="relative my-6">
                        <div class="absolute inset-0 flex items-center">
                            <div class="w-full border-t border-cyber-pink/20"></div>
                        </div>
                        <div class="relative flex justify-center text-sm">
                            <span class="px-4 bg-cyber-darker text-cyber-muted">Or sign up with</span>
                        </div>
                    </div>

                    <!-- Social Sign Up -->
                    <div class="grid grid-cols-2 gap-4">
                        <button type="button"
                                class="flex items-center justify-center gap-3 bg-cyber-dark border border-cyber-cyan/30 text-cyber-text px-4 py-3 rounded-lg hover:border-cyber-cyan hover:shadow-cyber-cyan transition-all">
                            <i class="fab fa-google text-xl"></i>Google
                        </button>
                        <button type="button"
                                class="flex items-center justify-center gap-3 bg-cyber-dark border border-cyber-pink/30 text-cyber-text px-4 py-3 rounded-lg hover:border-cyber-pink hover:shadow-cyber-pink transition-all">
                            <i class="fab fa-github text-xl"></i>GitHub
                        </button>
                    </div>

                </form>
            </div>

            <!-- Login redirect -->
            <div class="mt-6 text-center">
                <p class="text-cyber-muted">
                    Already have an account?
                    <a href="/login.html" class="text-cyber-cyan hover:text-cyber-pink transition-colors font-semibold">
                        Sign in <i class="fas fa-arrow-right ml-1"></i>
                    </a>
                </p>
            </div>

        </div>
    </div>
</section>
</main>

<footer class="bg-cyber-dark border-t border-cyber-cyan/30 text-cyber-text py-8">
    <div class="container mx-auto px-4 text-center">
        <p class="text-cyber-muted text-sm">&copy; 2026 UniPack by LunosCode. All rights reserved.</p>
    </div>
</footer>

<script src="/js/api.js"></script>
<script src="/js/auth.js"></script>

</body>
</html>
